version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # User DB
      - USER_DB_HOST=user-db
      - USER_DB_PORT=5432
      - USER_DB_USER=user_admin
      - USER_DB_PASSWORD=secret123
      - USER_DB_NAME=user_db
      - USER_DB_SSLMODE=disable
      # Product DB
      - PRODUCT_DB_HOST=product-db
      - PRODUCT_DB_PORT=5432
      - PRODUCT_DB_USER=product_admin
      - PRODUCT_DB_PASSWORD=secret123
      - PRODUCT_DB_NAME=product_db
      - PRODUCT_DB_SSLMODE=disable
      # Order DB
      - ORDER_DB_HOST=order-db
      - ORDER_DB_PORT=5432
      - ORDER_DB_USER=order_admin
      - ORDER_DB_PASSWORD=secret123
      - ORDER_DB_NAME=order_db
      - ORDER_DB_SSLMODE=disable
      # Gotify
      - GOTIFY_URL=http://gotify:80
      - GOTIFY_TOKEN=YourGotifyAppTokenHere
    depends_on:
      user-db:
        condition: service_healthy
      product-db:
        condition: service_healthy
      order-db:
        condition: service_healthy
      gotify:
        condition: service_started

  user-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: product_admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_admin -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_admin -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotify:
    image: gotify/server:latest
    restart: always
    ports:
      - "8088:80"
    environment:
      - GOTIFY_SERVER_PORT=80
    volumes:
      - gotify_data:/app/data

volumes:
  user_db_data:
  product_db_data:
  order_db_data:
  gotify_data:
